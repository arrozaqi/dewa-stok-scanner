
name: Build Dewa Stock Scanner APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract scanner project
        run: |
          unzip -q dewa_stok_scanner_android_project.zip -d /tmp/scanner
          echo "PROJECT_DIR=/tmp/scanner/dewa_stok_scanner_android" >> "$GITHUB_ENV"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dewa-stok-scanner-apk
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 14
